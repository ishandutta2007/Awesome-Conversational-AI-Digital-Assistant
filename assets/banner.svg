<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#090d1f" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="taglineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }

    /* Subtle Animated Elements */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
      50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(-35px, 30px) scale(1.2); opacity: 0.6; }
    }
    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 360; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .dynamic-orb-1 {
      animation: pulseOrb1 9s ease-in-out infinite;
      transform-origin: 180px 140px;
    }
    .dynamic-orb-2 {
      animation: pulseOrb2 11s ease-in-out infinite;
      transform-origin: 1020px 280px;
    }
    .dynamic-wave {
      stroke-dasharray: 12 8;
      animation: waveMove 25s linear infinite;
    }
    .floating-card-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatPill 6s ease-in-out infinite 1s;
    }
    .floating-card-3 {
      animation: floatPill 5.5s ease-in-out infinite 2s;
    }
    .floating-card-4 {
      animation: floatPill 6.5s ease-in-out infinite 0.5s;
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND LIGHT ORBS -->
  <g class="dynamic-orb-1" filter="url(#glow)">
    <circle cx="180" cy="140" r="140" fill="#3b82f6" />
    <circle cx="240" cy="190" r="110" fill="#8b5cf6" opacity="0.6" />
  </g>
  <g class="dynamic-orb-2" filter="url(#glow)">
    <circle cx="1020" cy="270" r="150" fill="#06b6d4" />
    <circle cx="940" cy="220" r="100" fill="#ec4899" opacity="0.4" />
  </g>

  <!-- DYNAMIC AUDIO & CONVERSATION WAVE PATHS (Background depth) -->
  <g opacity="0.28">
    <path class="dynamic-wave" d="M 0 310 C 250 260, 400 370, 650 310 C 900 250, 1050 360, 1200 310" fill="none" stroke="#60a5fa" stroke-width="2.5" />
    <path class="dynamic-wave" d="M 0 330 C 200 390, 450 270, 700 340 C 950 410, 1080 290, 1200 330" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed clean view) -->
  <g id="foreground-content">
    <!-- Top Pill Category -->
    <g transform="translate(430, 42)">
      <rect x="0" y="0" width="340" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <circle cx="18" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" fill="url(#primaryGrad)" class="tagline-text" font-weight="700">CURATED AI AGENTS &amp; ASSISTANTS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" class="title-text" fill="url(#primaryGrad)" filter="url(#subtleGlow)">
      Awesome Conversational AI
    </text>
    <text x="600" y="180" text-anchor="middle" class="subtitle-text" fill="#f1f5f9">
      &amp; Digital Assistant Ecosystem 🤖🎙️
    </text>

    <!-- Subtitle Description -->
    <text x="600" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8" letter-spacing="0.2">
      Enterprise Platforms &bull; Open-Source Voice Frameworks &bull; Autonomous Agent Architectures &bull; Local-First RAG
    </text>

    <!-- Feature Badges / Highlights (Foreground) -->
    <g transform="translate(130, 265)">
      <!-- Pill 1 -->
      <g class="floating-card-1" transform="translate(0, 0)">
        <rect width="210" height="52" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
        <circle cx="28" cy="26" r="12" fill="rgba(56, 189, 248, 0.15)" />
        <text x="28" y="30" text-anchor="middle" font-size="14">💬</text>
        <text x="50" y="25" fill="#f8fafc" class="pill-text">Enterprise Copilots</text>
        <text x="50" y="41" fill="#64748b" font-family="sans-serif" font-size="11">M365, Gemini, watsonx</text>
      </g>

      <!-- Pill 2 -->
      <g class="floating-card-2" transform="translate(240, 0)">
        <rect width="210" height="52" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
        <circle cx="28" cy="26" r="12" fill="rgba(129, 140, 248, 0.15)" />
        <text x="28" y="30" text-anchor="middle" font-size="14">🎙️</text>
        <text x="50" y="25" fill="#f8fafc" class="pill-text">Real-Time Voice AI</text>
        <text x="50" y="41" fill="#64748b" font-family="sans-serif" font-size="11">Pipecat, LiveKit, Coqui</text>
      </g>

      <!-- Pill 3 -->
      <g class="floating-card-3" transform="translate(480, 0)">
        <rect width="210" height="52" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
        <circle cx="28" cy="26" r="12" fill="rgba(192, 132, 252, 0.15)" />
        <text x="28" y="30" text-anchor="middle" font-size="14">🔒</text>
        <text x="50" y="25" fill="#f8fafc" class="pill-text">Private &amp; Self-Hosted</text>
        <text x="50" y="41" fill="#64748b" font-family="sans-serif" font-size="11">LibreChat, Khoj, Open-WebUI</text>
      </g>

      <!-- Pill 4 -->
      <g class="floating-card-4" transform="translate(720, 0)">
        <rect width="210" height="52" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1.2" />
        <circle cx="28" cy="26" r="12" fill="rgba(45, 212, 191, 0.15)" />
        <text x="28" y="30" text-anchor="middle" font-size="14">⚡</text>
        <text x="50" y="25" fill="#f8fafc" class="pill-text">Agentic Workflows</text>
        <text x="50" y="41" fill="#64748b" font-family="sans-serif" font-size="11">Dify, AutoGen, ElizaOS</text>
      </g>
    </g>

    <!-- Sub-footer Meta Bar -->
    <g transform="translate(0, 375)">
      <line x1="120" y1="0" x2="1080" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="600" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" letter-spacing="1">
        ⭐ CURATED SAAS &amp; OPEN-SOURCE ECOSYSTEM &bull; UPDATED FOR 2026 ⭐
      </text>
    </g>
  </g>
</svg>