<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="50%" stop-color="#0e1329"/><stop offset="100%" stop-color="#090d1f"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="taglineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)"/></pattern></defs><style>@keyframes pulseOrb1{0%{transform:translate(0,0) scale(1);opacity:.45}50%{transform:translate(40px,-25px) scale(1.15);opacity:.7}}@keyframes pulseOrb2{0%{transform:translate(0,0) scale(1);opacity:.35}50%{transform:translate(-35px,30px) scale(1.2);opacity:.6}}@keyframes waveMove{0%{stroke-dashoffset:0}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:44px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:20px;letter-spacing:.5px}.pill-text,.subtitle-text,.tagline-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.tagline-text{font-weight:400;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}.pill-text{font-weight:600;font-size:13px}.dynamic-orb-1{animation:pulseOrb1 9s ease-in-out infinite;transform-origin:180px 140px}.dynamic-orb-2{animation:pulseOrb2 11s ease-in-out infinite;transform-origin:1020px 280px}.dynamic-wave{stroke-dasharray:12 8;animation:waveMove 25s linear infinite}.floating-card-1{animation:floatPill 5s ease-in-out infinite}.floating-card-2{animation:floatPill 6s ease-in-out infinite 1s}.floating-card-3{animation:floatPill 5.5s ease-in-out infinite 2s}.floating-card-4{animation:floatPill 6.5s ease-in-out infinite .5s}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><g class="dynamic-orb-1" filter="url(#glow)"><circle cx="180" cy="140" r="140" fill="#3b82f6"/><circle cx="240" cy="190" r="110" fill="#8b5cf6" opacity=".6"/></g><g class="dynamic-orb-2" filter="url(#glow)"><circle cx="1020" cy="270" r="150" fill="#06b6d4"/><circle cx="940" cy="220" r="100" fill="#ec4899" opacity=".4"/></g><g opacity=".28"><path fill="none" stroke="#60a5fa" stroke-width="2.5" d="M 0 310 C 250 260, 400 370, 650 310 C 900 250, 1050 360, 1200 310" class="dynamic-wave"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 0 330 C 200 390, 450 270, 700 340 C 950 410, 1080 290, 1200 330" class="dynamic-wave"/></g><g id="foreground-content"><g transform="translate(430, 42)"><rect width="340" height="32" x="0" y="0" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="5" fill="#10b981"/><text x="32" y="21" fill="url(#primaryGrad)" class="tagline-text" font-weight="700">CURATED AI AGENTS &amp; ASSISTANTS</text></g><text x="600" y="132" fill="url(#primaryGrad)" class="title-text" filter="url(#subtleGlow)" text-anchor="middle">Awesome Conversational AI</text><text x="600" y="180" fill="#f1f5f9" class="subtitle-text" text-anchor="middle">&amp; Digital Assistant Ecosystem 🤖🎙️</text><text x="600" y="218" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" letter-spacing=".2" text-anchor="middle">Enterprise Platforms • Open-Source Voice Frameworks • Autonomous Agent Architectures • Local-First RAG</text><g><g class="floating-card-1" transform="translate(130, 265) translate(0, 0)"><rect width="210" height="52" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" rx="14"/><circle cx="28" cy="26" r="12" fill="rgba(56, 189, 248, 0.15)"/><text x="28" y="30" font-size="14" text-anchor="middle">💬</text><text x="50" y="25" fill="#f8fafc" class="pill-text">Enterprise Copilots</text><text x="50" y="41" fill="#64748b" font-family="sans-serif" font-size="11">M365, Gemini, watsonx</text></g><g class="floating-card-2" transform="translate(130, 265) translate(240, 0)"><rect width="210" height="52" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" rx="14"/><circle cx="28" cy="26" r="12" fill="rgba(129, 140, 248, 0.15)"/><text x="28" y="30" font-size="14" text-anchor="middle">🎙️</text><text x="50" y="25" fill="#f8fafc" class="pill-text">Real-Time Voice AI</text><text x="50" y="41" fill="#64748b" font-family="sans-serif" font-size="11">Pipecat, LiveKit, Coqui</text></g><g class="floating-card-3" transform="translate(130, 265) translate(480, 0)"><rect width="210" height="52" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" rx="14"/><circle cx="28" cy="26" r="12" fill="rgba(192, 132, 252, 0.15)"/><text x="28" y="30" font-size="14" text-anchor="middle">🔒</text><text x="50" y="25" fill="#f8fafc" class="pill-text">Private &amp; Self-Hosted</text><text x="50" y="41" fill="#6474